# nginx de la réplica pública de CryptoBot (build PUBLIC_DEMO). Sirve UNA cosa: el bundle estático
# bajo /cryptobot/, que es la ruta pública (https://life-engine.app/cryptobot/). El Ingress manda
# acá sólo /cryptobot; el resto del host lo sirve la landing.
#
#   /healthz            → probes de k8s (el pod, no el visitante)
#   /cryptobot          → 301 /cryptobot/
#   /cryptobot/api/     → 404: esta página no tiene API, y un index.html con 200 lo escondería
#   /cryptobot/<asset>  → el archivo o 404 (un chunk que falta nunca devuelve HTML)
#   /cryptobot/<ruta>   → index.html (rutas de la SPA: /cryptobot/live, /cryptobot/value/<id>, …)
#   cualquier otra      → 404
#
# Sin escritura en disco salvo /tmp (pid y caches de nginx-unprivileged): corre con
# readOnlyRootFilesystem. Sin config por ambiente: la réplica no tiene backend que configurar.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /cryptobot {
        return 301 /cryptobot/;
    }

    location ^~ /cryptobot/api/ {
        return 404;
    }

    location = /cryptobot/index.html {
        include /etc/nginx/le-security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Bundles con hash en el nombre: inmutables.
    location ~ ^/cryptobot/(chunk|main|styles|polyfills)-[A-Za-z0-9]+\.(js|css)$ {
        include /etc/nginx/le-security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Otros archivos (marca, diagrama): existen o 404.
    location ~* ^/cryptobot/.+\.(js|mjs|css|map|svg|png|jpe?g|gif|ico|webp|woff2?|ttf|json|txt)$ {
        include /etc/nginx/le-security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location /cryptobot/ {
        include /etc/nginx/le-security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /cryptobot/index.html;
    }

    location / {
        return 404;
    }
}
