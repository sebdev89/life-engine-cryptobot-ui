# CI de cryptobot-ui: tests + build, y verificación de que la imagen del repo (Dockerfile propio,
# el mismo que usa el compose del demo) construye. Repo público desde 2026-09-30: un repo público
# no puede llamar workflows reutilizables de un repo privado, así que la imagen de plataforma
# (reusable de deploy) queda fuera de este CI. La imagen de GHCR no la consume ningún despliegue.
#
# Runner hosted: el repo no tiene runner propio.
# No despliega: la publicación en uat se hace por GitOps (internal ticket).
#
# Config en runtime: la imagen de la plataforma inyecta `window.__CRYPTOBOT_ENV = {...}` en
# index.html (UI_ENV_GLOBAL=__CRYPTOBOT_ENV, UI_ENV_JSON='{"cryptobotBase":"…","authBase":"…"}');
# src/app/config.ts lo lee por encima de /config.js. El Dockerfile del repo (compose del demo)
# sigue generando config.js con su entrypoint.
name: ui-image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build

  image:
    name: docker image (repo Dockerfile, no push)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image from the repo Dockerfile
        run: docker build --pull -t life-engine-cryptobot-ui:ci .
      - name: Smoke the image (nginx serves index.html)
        run: |
          set -euo pipefail
          docker run -d --rm --name ui-ci -p 8080:80 life-engine-cryptobot-ui:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -qi '<app-root' && echo "index.html OK"
          docker stop ui-ci >/dev/null

  # Réplica pública (build PUBLIC_DEMO): la página de https://life-engine.app/cryptobot/. Construye la
  # imagen con su propio Dockerfile (que ya corre check-dist: higiene + poda de chunks del operador),
  # la levanta con la raíz de sólo lectura como en k8s y la recorre con un navegador sin perfil
  # (walk.mjs: cero requests fuera de /cryptobot/, cero escrituras, sin rutas ni botones de operador,
  # proof verificado por el servicio Y en el navegador). En main publica la imagen en GHCR por
  # sha-<commit>; el deploy es GitOps (overlays/*/cryptobot-public-demo), nunca desde acá.
  public-demo:
    name: public demo (replay build, browser walk)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sebdev89/life-engine-cryptobot-public-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the replay image
        run: |
          set -euo pipefail
          c7="${GITHUB_SHA:0:7}"
          echo "C7=${c7}" >> "$GITHUB_ENV"
          docker build --pull -f docker/public-demo/Dockerfile \
            --build-arg GIT_COMMIT="${c7}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label life-engine.build.source=github-actions \
            -t "${IMAGE}:sha-${c7}" .
      - name: Run it like k8s does (read-only root, /tmp only)
        run: |
          set -euo pipefail
          docker run -d --rm --name pd --read-only --tmpfs /tmp -p 127.0.0.1:8080:8080 "${IMAGE}:sha-${C7}"
          up=0
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)" = 200 ]; then up=1; break; fi
            sleep 1
          done
          [ "$up" = 1 ] || { docker logs pd; echo "::error::the image never answered /healthz"; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1"; }
          for check in "/cryptobot/api/anything 404" "/ 404" "/cryptobot 301" "/cryptobot/ 200" "/cryptobot/value 200" "/cryptobot/value/any-deep-link 200"; do
            set -- $check
            got="$(code "$1")"
            echo "$1 → $got (want $2)"
            [ "$got" = "$2" ] || { docker logs pd; echo "::error::$1 answered $got, want $2"; exit 1; }
          done
          # sin `curl | grep -q`: bajo pipefail, grep -q corta el pipe y curl sale con SIGPIPE (falso rojo)
          html="$(curl -fsS http://127.0.0.1:8080/cryptobot/value/any-deep-link)"
          grep -q '<base href="/cryptobot/"' <<<"$html"
          # each anchored ValueEvent has its own link preview (og-pages.mjs + the nginx value/<uuid> location)
          ev="$(node -e 'const s=require("./src/app/public-demo/snapshot.json");console.log(s.responses["GET /value-events"].body[0].id)')"
          page="$(curl -fsS "http://127.0.0.1:8080/cryptobot/value/${ev}")"
          grep -q "cards/${ev}.png" <<<"$page" || { echo "::error::/cryptobot/value/${ev} has no own og:image"; exit 1; }
          grep -q '<base href="/cryptobot/"' <<<"$page"
      - name: Walk it in a headless browser
        run: |
          npx playwright install --with-deps chromium
          node scripts/public-demo/walk.mjs --url http://127.0.0.1:8080/cryptobot/
      - name: Publish (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:sha-${C7}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${C7}" | sed 's/.*@//')"
          {
            echo "## Public replay image"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| image | \`${IMAGE}:sha-${C7}\` |"
            echo "| digest | \`${digest}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "published ${IMAGE}@${digest}"
